# Render #1: coding agent. Manual alternative to scripts/deploy.ps1.
services:
  - type: web
    name: loopmates-coder
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev --omit=optional
    startCommand: node src/coder/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: SERVICE_SECRET, sync: false }
      - { key: API_URL, sync: false }
      - { key: GITHUB_TOKEN, sync: false }
