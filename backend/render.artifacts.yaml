# Render #2: artifacts -> your Google Drive. Manual alternative to scripts/deploy.ps1.
services:
  - type: web
    name: loopmates-artifacts
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev --omit=optional
    startCommand: node src/artifacts/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: SERVICE_SECRET, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: GOOGLE_REFRESH_TOKEN, sync: false }
