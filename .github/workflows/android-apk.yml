name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build the APK (signed with the debug key so it installs directly)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" -PreactNativeArchitectures=arm64-v8a
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Loopmates.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Loopmates-apk
          path: mobile/Loopmates.apk
          retention-days: 30
      - name: Publish to the "latest-apk" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest-apk Loopmates.apk --repo "$GITHUB_REPOSITORY" --title "Loopmates Android APK (latest)" --notes "Built from commit $GITHUB_SHA. Download Loopmates.apk on your phone and install it."
